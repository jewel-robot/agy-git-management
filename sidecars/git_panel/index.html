<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Git Management</title>
  <script src="/preload.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:ROND,opsz,slnt,wdth,wght@0..100,6..144,-10..0,92..100,100..1000&family=Google+Sans+Code:ital,wght@0,300..800;1,300..800&display=swap">
  <link rel="stylesheet" href="/styles.css?v=0.0.1-2">
</head>
<body>
  <div id="app" class="app">
    <!-- Top Sticky Header -->
    <header class="topbar">
      <div class="topbar-row">
        <div class="repo-wrap">
          <div id="repo-dropdown" class="custom-dd">
            <button type="button" id="repo-trigger" class="dd-trigger" aria-haspopup="listbox" aria-expanded="false" title="Switch Git repository">
              <svg class="dd-repo-icon" width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2.75A1.75 1.75 0 0 1 4.75 1h7.5A.75.75 0 0 1 13 1.75v10.5a.75.75 0 0 1-.75.75H4.75A1.75 1.75 0 0 0 3 14.75V2.75Z"/><path d="M3 13a1.75 1.75 0 0 1 1.75-1.75H13"/></svg>
              <span id="repo-trigger-label" class="dd-label">Loading…</span>
              <svg class="dd-chev" width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m4.5 6.25 3.5 3.5 3.5-3.5"/></svg>
            </button>
            <div id="repo-menu" class="dd-menu hidden" role="listbox" aria-label="Git repositories"></div>
          </div>
          <span id="op-badge" class="op-badge hidden"></span>
        </div>
        <div class="sync-actions">
          <button type="button" class="icon-btn" id="btn-fetch" title="Fetch all remotes (--prune)">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 8a5.5 5.5 0 1 1-1.35-3.6"/><path d="M13.5 2.5v2.75H10.75"/></svg>
          </button>
          <button type="button" class="icon-btn" id="btn-pull" title="Pull from upstream">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2.5v9"/><path d="M4.5 8.5 8 12l3.5-3.5"/><path d="M3 13.5h10"/></svg>
          </button>
          <button type="button" class="icon-btn" id="btn-push" title="Push to remote">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 12V3"/><path d="M4.5 6.5 8 3l3.5 3.5"/><path d="M3 13.5h10"/></svg>
          </button>
          <button type="button" class="icon-btn" id="btn-refresh" title="Refresh status">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 8a5.5 5.5 0 0 1 9.5-3.75L13.5 5.5"/><path d="M13.5 2.5v3h-3"/><path d="M13.5 8a5.5 5.5 0 0 1-9.5 3.75L2.5 10.5"/><path d="M2.5 13.5v-3h3"/></svg>
          </button>
        </div>
      </div>

      <div class="branch-strip">
        <button type="button" id="branch-pill" class="branch-pill" title="Switch to Branches tab">
          <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="4.5" cy="3.5" r="1.75"/><circle cx="11.5" cy="5.5" r="1.75"/><circle cx="4.5" cy="12.5" r="1.75"/><path d="M4.5 5.25v5.5M4.5 9.5c0-2 7-1 7-2.25"/></svg>
          <span id="branch-name">…</span>
        </button>
        <span id="ab-badge" class="ab-badge num hidden"></span>
        <span id="upstream-name" class="upstream-name"></span>
      </div>

      <nav class="tabs" role="tablist">
        <button type="button" class="tab active" data-tab="changes" role="tab" aria-selected="true">
          Changes <span id="tab-changes-count" class="tab-badge num">0</span>
        </button>
        <button type="button" class="tab" data-tab="graph" role="tab" aria-selected="false">Graph</button>
        <button type="button" class="tab" data-tab="branches" role="tab" aria-selected="false">Branches</button>
        <button type="button" class="tab" data-tab="github" role="tab" aria-selected="false">GitHub</button>
      </nav>
    </header>

    <!-- Empty State -->
    <div id="no-repo" class="empty-state hidden">
      <div class="empty-title">No Git repository detected</div>
      <div class="empty-sub">Open a workspace containing a Git repository, or click Refresh.</div>
    </div>

    <!-- Main Scrollable Content -->
    <main id="content" class="content">
      <!-- TAB 1: CHANGES -->
      <section id="view-changes" class="tab-view active">
        <div class="commit-box">
          <textarea id="commit-msg" class="commit-input" rows="2" placeholder="Commit message (Ctrl+Enter to commit)"></textarea>
          <div class="commit-bar">
            <label class="check-label" title="Amend the previous commit">
              <input type="checkbox" id="chk-amend">
              <span>Amend</span>
            </label>
            <div class="commit-btns">
              <button type="button" class="btn btn-ghost btn-sm" id="btn-stage-commit" title="Stage all changes and commit">Stage &amp; Commit</button>
              <button type="button" class="btn btn-primary btn-sm" id="btn-commit">Commit</button>
            </div>
          </div>
        </div>

        <div class="scm-toolbar">
          <div class="segmented">
            <button type="button" id="btn-view-flat" class="seg-btn on" title="Flat file list">Flat</button>
            <button type="button" id="btn-view-tree" class="seg-btn" title="Directory tree">Tree</button>
          </div>
          <div class="scm-toolbar-right">
            <button type="button" class="btn btn-ghost btn-xs" id="btn-stage-all" title="Stage all changes">Stage All</button>
            <button type="button" class="btn btn-ghost btn-xs" id="btn-unstage-all" title="Unstage all changes">Unstage All</button>
            <button type="button" class="btn btn-ghost btn-xs" id="btn-stash-toggle" title="Create a new stash">+ Stash</button>
          </div>
        </div>

        <!-- Inline Stash Form -->
        <div id="stash-form" class="inline-form hidden">
          <input type="text" id="stash-msg" class="input" placeholder="Optional stash message...">
          <div class="inline-form-row">
            <label class="check-label"><input type="checkbox" id="stash-untracked" checked><span>Include untracked</span></label>
            <div class="inline-form-btns">
              <button type="button" class="btn btn-ghost btn-xs" id="btn-stash-cancel">Cancel</button>
              <button type="button" class="btn btn-primary btn-xs" id="btn-stash-save">Save Stash</button>
            </div>
          </div>
        </div>

        <!-- File Groups -->
        <div id="changes-lists" class="changes-lists"></div>

        <!-- Inline Diff Drawer -->
        <div id="diff-pane" class="diff-pane hidden">
          <div class="diff-head">
            <div class="diff-title-wrap">
              <span id="diff-scope-tag" class="diff-scope-tag"></span>
              <span id="diff-file-path" class="diff-file-path mono"></span>
            </div>
            <div class="diff-head-actions">
              <div class="segmented">
                <button type="button" id="btn-diff-unified" class="seg-btn on">Unified</button>
                <button type="button" id="btn-diff-split" class="seg-btn">Split</button>
              </div>
              <button type="button" class="icon-btn" id="btn-diff-close" title="Close diff">&times;</button>
            </div>
          </div>
          <div id="diff-body" class="diff-body"></div>
        </div>

        <!-- Stashes Collapsible Section -->
        <details id="stashes-section" class="acc-section">
          <summary class="acc-summary">
            <span class="acc-title">Stashes</span>
            <span id="stashes-count" class="count-pill num">0</span>
          </summary>
          <div id="stashes-list" class="acc-body"></div>
        </details>
      </section>

      <!-- TAB 2: GRAPH -->
      <section id="view-graph" class="tab-view split-tab-view hidden">
        <div class="split-top">
          <div class="filter-bar">
            <input type="search" id="graph-search" class="input" placeholder="Search commit messages...">
            <button type="button" class="btn btn-ghost btn-xs" id="btn-graph-filters" title="More filters">Filters</button>
          </div>
          <div id="graph-extra-filters" class="extra-filters hidden">
            <input type="text" id="graph-author" class="input input-sm" placeholder="Filter by author...">
            <input type="text" id="graph-path" class="input input-sm" placeholder="Filter by file path...">
            <div class="extra-filters-row">
              <label class="check-label"><input type="checkbox" id="chk-all-branches" checked><span>All branches</span></label>
              <label class="check-label"><input type="checkbox" id="chk-dim-merges" checked><span>Dim merges</span></label>
              <button type="button" class="btn btn-primary btn-xs" id="btn-graph-apply">Apply</button>
            </div>
          </div>
          <div class="split-scroll">
            <div id="graph-list" class="graph-list"></div>
            <div id="graph-more-wrap" class="more-wrap hidden">
              <button type="button" class="btn btn-ghost btn-sm" id="btn-graph-more">Load more commits</button>
            </div>
          </div>
        </div>
        <!-- Docked Commit Detail & Diff Drawer -->
        <div id="commit-detail" class="commit-detail docked-drawer hidden"></div>
      </section>

      <!-- TAB 3: BRANCHES & WORKTREES -->
      <section id="view-branches" class="tab-view hidden">
        <div class="filter-bar">
          <input type="search" id="branch-search" class="input" placeholder="Filter branches...">
          <button type="button" class="btn btn-primary btn-xs" id="btn-new-branch-toggle">+ Branch</button>
        </div>

        <div id="new-branch-form" class="inline-form hidden">
          <input type="text" id="new-branch-name" class="input" placeholder="New branch name (e.g. feat/my-feature)">
          <input type="text" id="new-branch-start" class="input input-sm" placeholder="Start point (optional, default HEAD)">
          <div class="inline-form-row">
            <label class="check-label"><input type="checkbox" id="new-branch-checkout" checked><span>Checkout after create</span></label>
            <div class="inline-form-btns">
              <button type="button" class="btn btn-ghost btn-xs" id="btn-new-branch-cancel">Cancel</button>
              <button type="button" class="btn btn-primary btn-xs" id="btn-new-branch-create">Create</button>
            </div>
          </div>
        </div>

        <div id="branches-local-wrap" class="section-block"></div>
        <div id="branches-remote-wrap" class="section-block"></div>

        <!-- Worktrees -->
        <div class="section-block">
          <div class="section-head">
            <span class="section-title">Worktrees <span id="wt-count" class="count-pill num">0</span></span>
            <button type="button" class="btn btn-ghost btn-xs" id="btn-wt-toggle">+ Worktree</button>
          </div>
          <div id="wt-form" class="inline-form hidden">
            <input type="text" id="wt-path" class="input input-sm" placeholder="Target folder path (e.g. ../repo-wt)">
            <input type="text" id="wt-branch" class="input input-sm" placeholder="Branch name">
            <div class="inline-form-row">
              <label class="check-label"><input type="checkbox" id="wt-new-branch" checked><span>Create new branch (-b)</span></label>
              <div class="inline-form-btns">
                <button type="button" class="btn btn-ghost btn-xs" id="btn-wt-cancel">Cancel</button>
                <button type="button" class="btn btn-primary btn-xs" id="btn-wt-add">Add</button>
              </div>
            </div>
          </div>
          <div id="wt-list" class="item-list"></div>
        </div>

        <!-- Remotes -->
        <div class="section-block">
          <div class="section-head">
            <span class="section-title">Remotes</span>
          </div>
          <div id="remotes-list" class="item-list"></div>
        </div>
      </section>

      <!-- TAB 4: GITHUB -->
      <section id="view-github" class="tab-view hidden">
        <div class="gh-header">
          <div id="gh-repo-meta" class="gh-repo-meta">Detecting GitHub remote...</div>
          <div class="gh-header-actions">
            <button type="button" class="btn btn-ghost btn-xs" id="btn-gh-token-toggle" title="Configure GitHub Personal Access Token">Token</button>
            <button type="button" class="btn btn-primary btn-xs" id="btn-gh-pr-toggle">+ New PR</button>
          </div>
        </div>

        <!-- Token Form -->
        <div id="gh-token-form" class="inline-form hidden">
          <div id="gh-token-status" class="muted-note"></div>
          <input type="password" id="gh-token-input" class="input input-sm" placeholder="ghp_... (stored locally with 0600 permissions)">
          <div class="inline-form-row">
            <span class="muted-note">Used for private repos &amp; creating PRs</span>
            <div class="inline-form-btns">
              <button type="button" class="btn btn-ghost btn-xs" id="btn-gh-token-clear">Clear</button>
              <button type="button" class="btn btn-primary btn-xs" id="btn-gh-token-save">Save</button>
            </div>
          </div>
        </div>

        <!-- Create PR Form -->
        <div id="gh-pr-form" class="inline-form hidden">
          <input type="text" id="gh-pr-title" class="input input-sm" placeholder="Pull request title">
          <div class="pr-branch-row">
            <input type="text" id="gh-pr-head" class="input input-sm" placeholder="Head branch">
            <span class="pr-arrow">&rarr;</span>
            <input type="text" id="gh-pr-base" class="input input-sm" placeholder="Base branch (e.g. main)">
          </div>
          <textarea id="gh-pr-body" class="commit-input" rows="3" placeholder="Description..."></textarea>
          <div class="inline-form-row">
            <label class="check-label"><input type="checkbox" id="gh-pr-draft"><span>Draft PR</span></label>
            <div class="inline-form-btns">
              <button type="button" class="btn btn-ghost btn-xs" id="btn-gh-pr-cancel">Cancel</button>
              <button type="button" class="btn btn-primary btn-xs" id="btn-gh-pr-submit">Create PR</button>
            </div>
          </div>
        </div>

        <div class="gh-controls">
          <div class="segmented">
            <button type="button" id="btn-gh-sub-prs" class="seg-btn on">PRs <span id="gh-pr-count" class="num">0</span></button>
            <button type="button" id="btn-gh-sub-issues" class="seg-btn">Issues <span id="gh-issue-count" class="num">0</span></button>
          </div>
          <div class="segmented" id="gh-state-seg" role="group" aria-label="Filter state">
            <button type="button" class="seg-btn on" data-gh-state="open">Open</button>
            <button type="button" class="seg-btn" data-gh-state="closed">Closed</button>
            <button type="button" class="seg-btn" data-gh-state="all">All</button>
          </div>
        </div>

        <div id="gh-list" class="gh-list"></div>
        <div id="gh-detail" class="commit-detail hidden"></div>
      </section>
    </main>
  </div>

  <!-- Custom Confirm Modal -->
  <div id="modal-backdrop" class="modal-backdrop hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <div id="modal-title" class="modal-title"></div>
      <div id="modal-body" class="modal-body"></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost btn-sm" id="modal-cancel">Cancel</button>
        <button type="button" class="btn btn-danger btn-sm" id="modal-confirm">Confirm</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <script src="/app.js?v=0.0.1-2"></script>
</body>
</html>
